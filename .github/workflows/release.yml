name: Release 1.0

# 打 v* 标签（如 v1.0.0）时构建插件包并发布为 GitHub Release。
# 发布需要仓库 secret：GH_TOKEN（GitHub Personal Access Token，需 contents:write 权限）。
# 也支持手动触发（workflow_dispatch）构建产物但不发布正式 Release（仅 artifact）。
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Package plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # no committed lockfile — `cache: npm` fails the step outright
          # ("Dependencies lock file is not found")

      - name: Install dependencies
        run: npm install

      - name: Syntax check
        run: |
          node --check index.js
          node --check client.js
          node --check typert.host.js
          node --check memory-core.mjs

      - name: Core self-test
        run: node scripts/self-test.mjs

      - name: Package tarball
        run: npm pack
        env:
          npm_config_package_lock: "false"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-tarball
          path: ./*.tgz

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts/

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            DeepSeek Harness 持久化记忆插件：ZCode 风格项目记忆 + 设置「记忆管理」页 + 索引式记忆注入 + agent 记忆工具（memory_save / memory_get / memory_list）+ ZCode 一键导入。

            ### 📦 安装
            ```bash
            git clone git@github.com:MoonlitDropOfBlood/dsh-memory-manager.git
            cd dsh-memory-manager
            node scripts/install.mjs
            # 重启 DSH 后，设置 → 记忆管理
            ```
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
