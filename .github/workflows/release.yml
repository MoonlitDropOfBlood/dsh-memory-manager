name: Release 1.0

# 打 v* 标签（如 v1.0.0）时构建插件包并发布为 GitHub Release。
# 发布凭证：优先用仓库 secret GH_TOKEN（PAT，contents:write），缺省回退内置
# GITHUB_TOKEN（工作流已声明 permissions: contents: write）。
# 也支持手动触发（workflow_dispatch）构建产物但不发布正式 Release（仅 artifact）。
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Package plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # no committed lockfile — `cache: npm` fails the step outright
          # ("Dependencies lock file is not found")

      - name: Install dependencies
        run: npm install

      - name: Syntax check
        run: |
          node --check index.js
          node --check client.js
          node --check typert.host.js
          node --check memory-core.mjs

      - name: Core self-test + typert contract
        run: npm test

      - name: Package tarball
        run: npm pack
        env:
          npm_config_package_lock: "false"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-tarball
          path: ./*.tgz

  publish-npm:
    # npm OIDC Trusted Publishing (no static token / no OTP). Requires npm
    # CLI >= 11.5.1 and Node >= 22.14 (Node 24 bundles npm 11). Configure the
    # trusted publisher on npmjs.com for this package first (repo
    # MoonlitDropOfBlood/dsh-memory-manager + .github/workflows/release.yml),
    # then every v* tag push publishes to npm automatically.
    name: Publish to npm (Trusted Publishing)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install
      - run: npm publish

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts/

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            DeepSeek Harness 持久化记忆插件：ZCode 风格项目记忆 + 设置「记忆管理」页 + 索引式记忆注入 + agent 记忆生命周期工具 + ZCode 一键导入。

            ### 🆕 v1.5.0 — 记忆生命周期与写安全
            - **回收站（软删除）**：删除不再永久销毁，「删除」= 移入 `<project>/.archive/`（带 `forgotAt`/`forgotReason` 墓志铭），可在「记忆管理 → 回收站 (n)」恢复；只有「彻底删除」才移除文件。
            - **取代链（纠错）**：新增 `memory_correct` 工具 —— 新条目记 `supersedes`，旧条目转 `status: superseded` + `supersededBy`（留在磁盘可审计、不再注入索引）；同名原地纠正会把旧版快照进 `<project>/.history/`（每名最多 5 份）。
            - **来源与时效标注**：注入行变为 `- [type] name — desc（人工/AI/导入, 日期[, 置顶][, 可能过时]）`，模型能折价自己写下的旧结论；超过类型相关期（user 10 年 / feedback 3 年 / project·reference 180 天）且非置顶的条目标「可能过时」。
            - **注入排序与预算**：置顶 > 类型权重 > 使用次数（`memory_get` 命中累加）> 新旧；每节 24 条 / 6000 字符，被裁掉的在标题显示「注入前 N 条」，不再静默丢记忆。
            - **相似记忆提示**：新建时按「名称字符 bigram + TF-IDF 语义余弦 + 释义改写」三层检测近重复（阈值用真实库 2485 对校准），提示改用 `memory_correct`。
            - **agent 工具 3 → 6**：`memory_save` / `memory_get` / `memory_list` / `memory_forget` / `memory_correct` / `memory_review`（体检：过时 / 长期未读 / 疑似重复 / 已被取代）。
            - **写安全**：所有变更走跨进程目录锁（`<DSH_HOME>/memories/.lock`，崩溃残留 15s 可接管）+ 原子 `rename`；`expectedUpdatedAt` 版本校验让并发编辑收到「已被其他会话修改」而不是互相覆盖。
            - **性能**：写入后的索引重建与注入渲染改为只扫「当前项目 + global」，不再 O(全库)。
            - **修复**：列表行点「编辑」曾以空正文打开表单，保存会清空记忆正文 —— 现在先读取全文，并配合 `.history` 快照双保险。
            - **Remote 8 → 11**：新增 `forget` / `restore` / `purge`，typert schema、client 描述符与契约测试同步。
            - **兼容性**：旧记忆文件无需迁移（无 `status` 视为 active，未写入的生命周期字段保持原格式）；回滚到 v1.4.x 会丢掉生命周期标注，但正文与索引仍可读。
            - **验证**：核心自测 116 项断言、typert 契约 390 项检查、`npm run e2e` 对真实 DSH 0.2.2-rc.1 全绿（含回收站回路与 stale-write 冲突）。

            ### 📦 前一版 v1.4.4
            - 修 DSH 0.2.2-rc.1 设置导航的「一行两个图标」：改走原生 `settings.section.icon` 槽，DSH ≤ 0.2.1 的 CSS 兜底保留并按 DOM 形状门控，两条路径互斥。

            ### 📦 安装（标准 DSH bundle）
            ```bash
            dsh plugin --profile web add @duke-dsh-plugins/dsh-memory-manager
            # 重启 DSH 后，设置 → 记忆管理
            ```
            > 需要钉版本时用下方 Assets 里的 tarball（`duke-dsh-plugins-dsh-memory-manager-<版本>.tgz`）。
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
